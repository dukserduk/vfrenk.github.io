<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <title>Projects - Victor Frenklakh</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      background-color: #f4f4f4;
      color: #222;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    header {
      border-bottom: 2px solid #eee;
      padding-bottom: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }
    header h1 { font-size: 1.6rem; }
    nav { margin-top: 10px; }
    .nav-list { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
    .nav-list a {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #dde5ff;
      background: #f0f4ff;
      color: #0077cc;
      text-decoration: none;
      font-size: 0.85rem;
    }
    .nav-list a:hover { background: #e2ebff; }
    .section { margin-top: 20px; }
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
      margin-bottom: 10px;
      color: #333;
    }
    .item { margin-bottom: 15px; }
    .item-header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px;
      font-weight: 600;
    }
    .item-date { font-size: 0.85rem; color: #777; }
    .item-subtitle { font-size: 0.9rem; color: #555; }
    .item ul { margin: 5px 0 0 18px; font-size: 0.9rem; }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 10px;
    }

    .project-card {
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 10px;
    }

    .project-image {
      width: 100%;
      height: auto;
      max-height: 220px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .music-controls {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 1000;
    }

    .music-button {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid #dde5ff;
      background: #f0f4ff;
      color: #0077cc;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .music-button:hover {
      background: #e2ebff;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Victor Frenklakh</h1>
        <div class="item-subtitle">Projects</div>
      </div>
      <nav>
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
        </ul>
      </nav>
      <div class="music-controls">
        <button id="music-toggle" class="music-button" type="button">Play Music</button>
      </div>
    </header>

    <section class="section">
      <div class="section-title">Projects</div>
      <div class="projects-grid">
        <article class="project-card">
          <img src="Photos/DMHOME.png" alt="Project 1 preview" class="project-image" />
          <div class="item">
            <div class="item-header">
              <span>Project One</span>
              <span class="item-date">2024</span>
            </div>
            <div class="item-subtitle">Sample project description with image preview.</div>
          </div>
        </article>

        <article class="project-card">
          <img src="Photos/photo2.jpg" alt="Project 2 preview" class="project-image" />
          <div class="item">
            <div class="item-header">
              <span>Project Two</span>
              <span class="item-date">2024</span>
            </div>
            <div class="item-subtitle">Another project showcased with a screenshot.</div>
          </div>
        </article>

        <article class="project-card">
          <img src="Photos/photo3.jpg" alt="Project 3 preview" class="project-image" />
          <div class="item">
            <div class="item-header">
              <span>Project Three</span>
              <span class="item-date">2023</span>
            </div>
            <div class="item-subtitle">Highlighting a different type of work.</div>
          </div>
        </article>

        <article class="project-card">
          <img src="Photos/photo4.jpg" alt="Project 4 preview" class="project-image" />
          <div class="item">
            <div class="item-header">
              <span>Project Four</span>
              <span class="item-date">2023</span>
            </div>
            <div class="item-subtitle">Fourth example project in the gallery.</div>
          </div>
        </article>
      </div>
    </section>
  </div>

  <audio id="bg-music" src="videos/Video1.mp4" loop></audio>

  <script>
    (function () {
      var audio = document.getElementById('bg-music');
      var button = document.getElementById('music-toggle');
      if (!audio || !button) return;

      button.addEventListener('click', function () {
        if (audio.paused) {
          audio.play().then(function () {
            button.textContent = 'Pause Music';
          }).catch(function () {
            button.textContent = 'Play Music';
          });
        } else {
          audio.pause();
          button.textContent = 'Play Music';
        }
      });
    })();
  </script>
</body>
</html>
